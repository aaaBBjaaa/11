<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fb">
<title>授权培训笔试刷题</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e3e8ef;--blue:#2563eb;--green:#15803d;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.65}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-size:14px;color:var(--muted)}h1{font-size:clamp(22px,4vw,30px);line-height:1.3;margin:4px 0 0}
.pill{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;white-space:nowrap}
.progress{height:6px;background:#e7ebf2;border-radius:99px;overflow:hidden;margin:18px 0 24px}.bar{height:100%;background:var(--blue);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);box-shadow:0 6px 24px rgba(16,24,40,.04)}
.meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.question{font-size:clamp(18px,3vw,22px);font-weight:650;line-height:1.6;margin:18px 0 22px;white-space:pre-wrap}
.options{display:grid;gap:11px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 15px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit;cursor:pointer;transition:border-color .15s,background .15s;min-height:52px}
.option:hover{border-color:#9bb8fb}.letter{display:inline-flex;align-items:center;justify-content:center;flex:0 0 27px;height:27px;border:1px solid #d5dbe5;border-radius:50%;font-size:13px;font-weight:650;color:#475467}
.option.correct{border-color:#86d6a0;background:#f0fdf4}.option.correct .letter{background:var(--green);border-color:var(--green);color:#fff}
.option.wrong{border-color:#f0a6a0;background:#fff5f4}.option.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
.feedback{display:none;margin-top:18px;padding:15px 16px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}.feedback.show{display:block}.result{font-weight:700;margin-bottom:5px}.result.ok{color:var(--green)}.result.no{color:var(--red)}.explain{white-space:pre-wrap;color:#475467;font-size:14px;margin-top:8px}.answerline{font-size:14px;color:#344054}
.controls{display:flex;gap:10px;margin-top:22px}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 16px;background:#fff;color:var(--text);font:inherit;font-weight:600;cursor:pointer;min-height:46px}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.4;cursor:not-allowed}.controls .primary{margin-left:auto}
.jump{display:flex;gap:8px;align-items:center;margin-top:16px;color:var(--muted);font-size:14px}.jump input{width:82px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:inherit}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:520px){.wrap{padding:17px 12px 28px}.top{align-items:flex-start}.card{border-radius:15px}.option{padding:12px}.controls .btn{padding:10px 12px}.jump{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="brand">授权培训 · 学习工具</div><h1>笔试刷题</h1></div>
    <div class="pill" id="countPill">共 80 题</div>
  </header>
  <div class="meta"><span id="progressText">第 1 题</span><span>单选题 · 点击选项查看答案</span></div>
  <div class="progress"><div class="bar" id="progressBar"></div></div>
  <main class="card">
    <div class="meta"><span id="chapter"></span><span id="answered"></span></div>
    <div class="question" id="stem">正在加载题库…</div>
    <div class="options" id="options"></div>
    <section class="feedback" id="feedback" aria-live="polite">
      <div class="result" id="result"></div>
      <div class="answerline" id="answerline"></div>
      <div class="explain" id="explanation"></div>
    </section>
    <div class="controls">
      <button class="btn" id="prev">上一题</button>
      <button class="btn" id="reset">重做本题</button>
      <button class="btn primary" id="next">下一题 →</button>
    </div>
    <div class="jump"><label for="jumpInput">跳转到第</label><input id="jumpInput" type="number" min="1" value="1"><span>题</span><button class="btn" id="jumpBtn">跳转</button></div>
  </main>
  <div class="footer">题库在本网页中读取，不需要注册或登录。</div>
</div>
<script>
let questions=[], index=0, selected={}, totalAnswered=0;
const $=id=>document.getElementById(id);
async function init(){
  try{
    const res=await fetch('./questions.json');
    if(!res.ok) throw new Error('题库文件加载失败');
    questions=await res.json();
    $('countPill').textContent=`共 ${questions.length} 题`;
    render();
  }catch(e){
    $('stem').textContent='题库加载失败。请确认 index.html 与 questions.json 放在同一个文件夹，并通过网站地址访问。';
    $('options').innerHTML='';
  }
}
function answerKeys(q){return (q.answer||[]).map(x=>String(x).trim().toUpperCase()).filter(x=>/^[A-H]$/.test(x))}
function render(){
  if(!questions.length)return;
  const q=questions[index], chosen=selected[index];
  $('progressText').textContent=`第 ${index+1} 题 / 共 ${questions.length} 题`;
  $('progressBar').style.width=`${(index+1)/questions.length*100}%`;
  $('chapter').textContent=q.chapter||'授权培训笔试';
  $('answered').textContent=chosen?'已作答':'未作答';
  $('stem').textContent=q.stem;
  $('options').innerHTML='';
  const correct=answerKeys(q);
  q.options.forEach(opt=>{
    const b=document.createElement('button'); b.type='button'; b.className='option';
    const letter=document.createElement('span');letter.className='letter';letter.textContent=opt.key;
    const text=document.createElement('span');text.textContent=opt.text;
    b.append(letter,text);
    if(chosen){
      if(correct.includes(opt.key))b.classList.add('correct');
      else if(chosen===opt.key)b.classList.add('wrong');
      b.disabled=true;
    }else b.addEventListener('click',()=>{selected[index]=opt.key;render();});
    $('options').appendChild(b);
  });
  const feedback=$('feedback');
  if(chosen){
    feedback.classList.add('show');
    const ok=correct.includes(chosen);
    $('result').className='result '+(ok?'ok':'no');
    $('result').textContent=ok?'回答正确':'回答错误';
    $('answerline').textContent='正确答案：'+(q.answerRaw||correct.join('、'));
    $('explanation').textContent=q.explanation?('解析：'+q.explanation):'本题暂无解析。';
  }else{feedback.classList.remove('show');}
  $('prev').disabled=index===0;$('next').disabled=index===questions.length-1;
  $('jumpInput').value=index+1;
  $('countPill').textContent=`已答 ${Object.keys(selected).length} / ${questions.length}`;
}
$('prev').addEventListener('click',()=>{if(index>0){index--;render();}});
$('next').addEventListener('click',()=>{if(index<questions.length-1){index++;render();}});
$('reset').addEventListener('click',()=>{delete selected[index];render();});
$('jumpBtn').addEventListener('click',()=>{const n=Number($('jumpInput').value);if(Number.isInteger(n)&&n>=1&&n<=questions.length){index=n-1;render();}});
$('jumpInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('jumpBtn').click();});
init();
</script>
</body>
</html>
